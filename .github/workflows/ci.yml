name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions: {} # Each job defines its own permissions explicitly

jobs:
  build:
    name: Build
    permissions:
      contents: read # Access to check out code and install dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install

      - name: Codegen
        run: pnpm run codegen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck code with TypeScript
        run: pnpm run typecheck

      - name: Lint code with ESLint
        run: pnpm run lint

      - name: Check code formatting with Prettier
        run: pnpm run format:check

      - name: Run tests
        run: |
          pnpm --filter @jeremyng/client exec playwright install --with-deps chromium
          pnpm run test

      - name: Build
        run: pnpm run build
